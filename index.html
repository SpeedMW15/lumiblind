<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiBlind - Control de Persiana</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .title {
      text-align: center;
      margin-bottom: 20px;
    }
    .title h2 { margin: 0; color: #38bdf8; font-size: 1.6rem; }
    .title p { margin: 4px 0 0; color: #94a3b8; font-size: 0.85rem; }

    /* ESTILOS DE LA ANIMACIÓN DE LA PERSIANA */
    .window-frame {
      width: 100%;
      height: 180px;
      background: linear-gradient(180deg, #38bdf8 0%, #fbbf24 100%);
      border: 6px solid #475569;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }
    .blind-curtain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%; /* 100% = totalmente bajada/cerrada */
      background: repeating-linear-gradient(
        0deg,
        #1e293b,
        #1e293b 12px,
        #0f172a 12px,
        #0f172a 15px
      );
      transition: height 0.5s ease-in-out;
      border-bottom: 5px solid #020617;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-connect { background: #2563eb; color: white; margin-bottom: 16px; }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-action { background: #334155; color: white; }
    .btn-action:active { transform: scale(0.98); }

    .setting-group {
      background: #0f172a;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .setting-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #94a3b8; }

    .switch-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .console-box {
      background: #020617;
      border-radius: 10px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      height: 70px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">
      <h2>LumiBlind</h2>
      <p>Sistema Inteligente de Persiana BLE</p>
    </div>

    <!-- Animación de Persiana Virtual -->
    <div class="window-frame">
      <div id="blind-curtain" class="blind-curtain"></div>
    </div>

    <div class="status-bar">
      <div id="status-indicator" class="status-dot"></div>
      <span id="status-text" style="font-size: 0.9rem; color: #cbd5e1;">Desconectado</span>
    </div>

    <button id="connect-btn" class="btn btn-connect" onclick="toggleConnect()">🔗 Conectar Bluetooth</button>

    <div class="controls-grid">
      <button class="btn btn-action" onclick="setBlindPosition(100, 'O')">▲ Subir (100%)</button>
      <button class="btn btn-action" onclick="setBlindPosition(0, 'C')">▼ Bajar (0%)</button>
    </div>

    <div class="setting-group">
      <label>Posición manual (<span id="pos-val">0%</span>)</label>
      <input type="range" id="pos-slider" min="0" max="100" value="0" oninput="updateVisualBlind(this.value)" onchange="sendSliderPosition(this.value)" style="width: 100%; accent-color: #38bdf8;">
    </div>

    <div class="setting-group switch-container">
      <span style="font-size: 0.9rem; color: #f8fafc;">Modo Automático (Fotocelda)</span>
      <input type="checkbox" id="auto-mode" onchange="toggleAutoMode(this.checked)" style="width: 20px; height: 20px; accent-color: #10b981;">
    </div>

    <div class="setting-group">
      <label>Umbral de luz automático (<span id="threshold-val">2000</span>)</label>
      <input type="range" id="threshold-slider" min="500" max="4000" step="100" value="2000" onchange="sendThreshold(this.value)" style="width: 100%; accent-color: #10b981;">
    </div>

    <div id="console-log" class="console-box">> LumiBlind listo...</div>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice;
    let rxCharacteristic;

    function log(msg) {
      const consoleEl = document.getElementById('console-log');
      consoleEl.innerHTML += `<div>> ${msg}</div>`;
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // Actualiza la persiana animada en la pantalla
    function updateVisualBlind(percent) {
      document.getElementById('pos-val').innerText = `${percent}%`;
      // Convertir el porcentaje de apertura al porcentaje de cobertura de la persiana
      const curtainHeight = 100 - percent;
      document.getElementById('blind-curtain').style.height = `${curtainHeight}%`;
    }

    async function toggleConnect() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
        updateStatus(false);
        log("Desconectado.");
        return;
      }

      try {
        log("Buscando LumiBlind...");
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'LumiBlind' }],
          optionalServices: [SERVICE_UUID]
        });

        log(`Conectando...`);
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

        updateStatus(true);
        log("¡Conectado exitosamente!");
      } catch (error) {
        log(`Error: ${error.message || error}`);
        updateStatus(false);
      }
    }

    function updateStatus(connected) {
      const ind = document.getElementById('status-indicator');
      const txt = document.getElementById('status-text');
      const btn = document.getElementById('connect-btn');

      if (connected) {
        ind.style.background = '#22c55e';
        txt.innerText = 'Conectado';
        btn.innerText = '❌ Desconectar';
        btn.style.background = '#ef4444';
      } else {
        ind.style.background = '#ef4444';
        txt.innerText = 'Desconectado';
        btn.innerText = '🔗 Conectar Bluetooth';
        btn.style.background = '#2563eb';
      }
    }

    async function sendCommand(cmd) {
      if (!rxCharacteristic) {
        log("Mensaje: Sin conexión BLE activa.");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(cmd));
        log(`Enviado: ${cmd}`);
      } catch (error) {
        log(`Error al enviar: ${error.message}`);
      }
    }

    function setBlindPosition(percent, cmd) {
      updateVisualBlind(percent);
      document.getElementById('pos-slider').value = percent;
      sendCommand(cmd);
    }

    function sendSliderPosition(percent) {
      updateVisualBlind(percent);
      sendCommand(`P${percent}`);
    }

    function toggleAutoMode(active) {
      log(`Modo automático: ${active ? "activado" : "desactivado"}`);
      sendCommand(active ? 'M1' : 'M0');
    }

    function sendThreshold(val) {
      document.getElementById('threshold-val').innerText = val;
      sendCommand(`U${val}`);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      });
    }
  </script>
</body>
</html>
