<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiBlind - Control de Persiana</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      border-radius: 16px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="margin: 0 0 8px 0; color: #38bdf8; font-size: 1.5rem;">LumiBlind</h2>
      <p style="margin: 0; color: #94a3b8; font-size: 0.9rem;">Control BLE de Persiana (iOS & Android)</p>
    </div>

    <div style="background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 20px; text-align: center;">
      <div id="status-indicator" style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ef4444; margin-right: 8px;"></div>
      <span id="status-text" style="font-weight: 500; color: #cbd5e1;">Desconectado</span>
    </div>

    <button id="connect-btn" class="btn" onclick="toggleConnect()" style="background: #2563eb; color: white; margin-bottom: 24px;">
      🔗 Conectar Bluetooth
    </button>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
      <button class="btn" onclick="sendCommand('A')" style="background: #10b981; color: white;">
        ▲ Subir (Abrir)
      </button>
      <button class="btn" onclick="sendCommand('C')" style="background: #64748b; color: white;">
        ▼ Bajar (Cerrar)
      </button>
    </div>

    <div style="background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.85rem;">Posición manual (%)</label>
      <input type="range" id="pos-slider" min="0" max="100" value="0" onchange="sendPosition(this.value)" style="width: 100%; accent-color: #38bdf8;">
      <div style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 0.8rem; color: #64748b;">
        <span>0% (Cerrado)</span>
        <span id="pos-val">0%</span>
        <span>100% (Abierto)</span>
      </div>
    </div>

    <div style="background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.8rem; color: #38bdf8; height: 80px; overflow-y: auto;" id="console-log">
      > Listo para conectar...
    </div>
  </div>

  <script>
    // UUIDs de BLE configurados en el ESP32
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice;
    let rxCharacteristic;

    function log(msg) {
      const consoleEl = document.getElementById('console-log');
      consoleEl.innerHTML += `<div>> ${msg}</div>`;
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function toggleConnect() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
        updateStatus(false);
        log("Desconectado.");
        return;
      }

      try {
        log("Buscando LumiBlind por BLE...");
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'LumiBlind' }],
          optionalServices: [SERVICE_UUID]
        });

        log(`Conectando a ${bluetoothDevice.name}...`);
        const server = await bluetoothDevice.gatt.connect();
        
        log("Obteniendo servicio BLE...");
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        log("Obteniendo característica...");
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

        updateStatus(true);
        log("¡Conectado exitosamente!");
      } catch (error) {
        log(`Error: ${error.message || error}`);
        updateStatus(false);
      }
    }

    function updateStatus(connected) {
      const ind = document.getElementById('status-indicator');
      const txt = document.getElementById('status-text');
      const btn = document.getElementById('connect-btn');

      if (connected) {
        ind.style.background = '#22c55e';
        txt.innerText = 'Conectado';
        btn.innerText = '❌ Desconectar';
        btn.style.background = '#ef4444';
      } else {
        ind.style.background = '#ef4444';
        txt.innerText = 'Desconectado';
        btn.innerText = '🔗 Conectar Bluetooth';
        btn.style.background = '#2563eb';
      }
    }

    async function sendCommand(cmd) {
      if (!rxCharacteristic) {
        log("Error: No hay conexión Bluetooth.");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(cmd));
        log(`Enviado comando: ${cmd}`);
      } catch (error) {
        log(`Error enviando comando: ${error.message}`);
      }
    }

    function sendPosition(val) {
      document.getElementById('pos-val').innerText = `${val}%`;
    }

    // Registro del Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado', reg))
          .catch(err => console.error('Error en Service Worker', err));
      });
    }
  </script>
</body>
</html>
